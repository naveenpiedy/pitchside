[project]
name = "pitchside"
version = "0.1.0"
description = "Local cricket analytics engine over Cricsheet data, stored in DuckDB"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Naveen Piedy" }]
keywords = ["cricket", "analytics", "ipl", "t20", "duckdb", "mcp", "cricsheet"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "mcp>=2.3.0",
    "pyarrow>=17",
    "typer>=0.12",
]

[project.urls]
Repository = "https://github.com/naveenpiedy/pitchside"
Methods = "https://github.com/naveenpiedy/pitchside/blob/master/docs/METHODS.md"

[project.scripts]
pitchside = "pitchside.cli:app"
pitchside-mcp = "pitchside.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pitchside"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs downloaded Cricsheet data"]
