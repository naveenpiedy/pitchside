[project]
name = "pitchside"
version = "0.1.0"
description = "Local cricket analytics engine over Cricsheet data, stored in DuckDB"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "pyarrow>=17",
    "typer>=0.12",
]

[project.scripts]
pitchside = "pitchside.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pitchside"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs downloaded Cricsheet data"]
