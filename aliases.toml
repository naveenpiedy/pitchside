"M Chinnaswamy Stadium, Bengaluru" = ["M Chinnaswamy Stadium", "M.Chinnaswamy Stadium"]
"MA Chidambaram Stadium, Chepauk, Chennai" = ["MA Chidambaram Stadium", "MA Chidambaram Stadium, Chepauk"]
"Maharaja Yadavindra Singh International Cricket Stadium, New Chandigarh" = ["Maharaja Yadavindra Singh International Cricket Stadium, Mullanpur"]
"Maharashtra Cricket Association Stadium, Pune" = ["Maharashtra Cricket Association Stadium", "Subrata Roy Sahara Stadium"]
"Punjab Cricket Association IS Bindra Stadium, Mohali" = ["Punjab Cricket Association IS Bindra Stadium", "Punjab Cricket Association IS Bindra Stadium, Mohali, Chandigarh", "Punjab Cricket Association Stadium, Mohali"]
"Rajiv Gandhi International Stadium, Uppal, Hyderabad" = ["Rajiv Gandhi International Stadium", "Rajiv Gandhi International Stadium, Uppal"]
"Sawai Mansingh Stadium, Jaipur" = ["Sawai Mansingh Stadium"]
"Shaheed Veer Narayan Singh International Stadium, Raipur" = ["Shaheed Veer Narayan Singh International Stadium"]
"Wankhede Stadium, Mumbai" = ["Wankhede Stadium"]
"Zayed Cricket Stadium, Abu Dhabi" = ["Sheikh Zayed Stadium"]
# Kept apart on purpose: "Sardar Patel Stadium, Motera" (to 2015) and "Narendra Modi
# Stadium, Ahmedabad" (from 2021) are the same site, but the ground was rebuilt.

# Grounds seen under one name only. Listing them marks them as known, so
