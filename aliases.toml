# Canonical names for teams and venues that Cricsheet records under several names.
#   canonical name = [other names it has appeared under, plus short codes]
# Teams: canonical = the franchise's current name. Renamed franchises keep their
# history ("Delhi Daredevils" seasons count as Delhi Capitals); the name used in
# a given season is still available as team_name / opposition_name.
# Venues: canonical = one name per ground.

[teams]
"Chennai Super Kings" = ["CSK"]
"Delhi Capitals" = ["Delhi Daredevils", "DC", "DD"]
"Deccan Chargers" = ["DCH"]
"Gujarat Lions" = ["GL"]
"Gujarat Titans" = ["GT"]
"Kochi Tuskers Kerala" = ["KTK"]
"Kolkata Knight Riders" = ["KKR"]
"Lucknow Super Giants" = ["LSG"]
"Mumbai Indians" = ["MI"]
"Pune Warriors" = ["Pune Warriors India", "PWI"]
"Punjab Kings" = ["Kings XI Punjab", "PBKS", "KXIP"]
"Rajasthan Royals" = ["RR"]
"Rising Pune Supergiant" = ["Rising Pune Supergiants", "RPS"]
"Royal Challengers Bengaluru" = ["Royal Challengers Bangalore", "RCB"]
"Sunrisers Hyderabad" = ["SRH"]

[venues]
"Arun Jaitley Stadium, Delhi" = ["Arun Jaitley Stadium", "Feroz Shah Kotla"]
"Brabourne Stadium, Mumbai" = ["Brabourne Stadium"]
"Dr DY Patil Sports Academy, Navi Mumbai" = ["Dr DY Patil Sports Academy", "Dr DY Patil Sports Academy, Mumbai"]
"Dr. Y.S. Rajasekhara Reddy ACA-VDCA Cricket Stadium, Visakhapatnam" = ["Dr. Y.S. Rajasekhara Reddy ACA-VDCA Cricket Stadium"]
"Eden Gardens, Kolkata" = ["Eden Gardens"]
