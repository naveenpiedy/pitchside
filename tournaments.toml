# Competitions tracked by the engine. One DuckDB file per key: db/<key>.duckdb
#   cricsheet : download name on https://cricsheet.org/downloads/ (<name>_json.zip)
#   event     : info.event.name in the match files, used to pick matches out of
#               the shared recently-added zips during sync
#   status    : "ongoing" (synced) or "ended" (frozen)
#   rule_eras : first seasons of new playing-condition eras; true-stat wicket and
#               setting/chasing factors are estimated separately within each era

[ipl]
name = "Indian Premier League"
cricsheet = "ipl_male"
event = "Indian Premier League"
format = "T20"
status = "ongoing"
rule_eras = [2023]  # Impact Player rule
